services:
  realm-store:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-everymusician}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-everymusic_realm}
    volumes:
      - realm-data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seeds/instruments.sql:/docker-entrypoint-initdb.d/02-instruments.sql:ro
      - ./backend/database/seeds/genres.sql:/docker-entrypoint-initdb.d/03-genres.sql:ro
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-everymusician} -d ${POSTGRES_DB:-everymusic_realm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - everymusic

  realm-nexus:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      REALM_ENV: production
      NEXUS_PORT: 8080
      NEXUS_HOST: 0.0.0.0
      TRUST_PROXY: "true"
      REALM_HOST: realm-store
      REALM_PORT: 5432
      REALM_NAME: ${POSTGRES_DB:-everymusic_realm}
      REALM_USER: ${POSTGRES_USER:-everymusician}
      REALM_PASSWORD: ${POSTGRES_PASSWORD}
      REALM_POOL_MIN: ${REALM_POOL_MIN:-2}
      REALM_POOL_MAX: ${REALM_POOL_MAX:-10}
      CIPHER_PRIMARY_KEY: ${CIPHER_PRIMARY_KEY:?CIPHER_PRIMARY_KEY is required}
      CIPHER_REFRESH_KEY: ${CIPHER_REFRESH_KEY:?CIPHER_REFRESH_KEY is required}
      TOKEN_LIFESPAN_MINUTES: ${TOKEN_LIFESPAN_MINUTES:-30}
      REFRESH_LIFESPAN_DAYS: ${REFRESH_LIFESPAN_DAYS:-30}
      TOKEN_ISSUER: ${TOKEN_ISSUER:-every.music}
      TOKEN_AUDIENCE: ${TOKEN_AUDIENCE:-every.music.clients}
      GOOGLE_IDENTITY_KEY: ${GOOGLE_IDENTITY_KEY:-}
      GOOGLE_IDENTITY_LOCK: ${GOOGLE_IDENTITY_LOCK:-}
      MAIL_GATEWAY: ${MAIL_GATEWAY:?MAIL_GATEWAY is required}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_IDENTITY: ${MAIL_IDENTITY:?MAIL_IDENTITY is required}
      MAIL_CREDENTIAL: ${MAIL_CREDENTIAL:?MAIL_CREDENTIAL is required}
      MAIL_SENDER_ALIAS: ${MAIL_SENDER_ALIAS:?MAIL_SENDER_ALIAS is required}
      PORTAL_ORIGINS: ${PORTAL_ORIGINS:-http://localhost,http://localhost:3000,http://tauri.localhost,tauri://localhost}
      RATE_WINDOW_MS: ${RATE_WINDOW_MS:-900000}
      RATE_THRESHOLD: ${RATE_THRESHOLD:-150}
      UPLOAD_BYTE_LIMIT: ${UPLOAD_BYTE_LIMIT:-5242880}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      realm-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - everymusic

  spectrum-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /realm
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-80}:8080"
    depends_on:
      realm-nexus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - everymusic

volumes:
  realm-data:
    name: everymusic-realm-volume

networks:
  everymusic:
    driver: bridge
