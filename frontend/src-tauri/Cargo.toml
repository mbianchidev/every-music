[package]
name = "everymusic"
version = "1.0.0"
description = "Every.music desktop client"
authors = ["Every.music contributors"]
license = "Apache-2.0"
repository = "https://github.com/mbianchidev/every-music"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "everymusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"

[workspace]
members = ["tests/glib-variant-iter"]

[patch.crates-io]
# TODO/FIXME(agents): Check for an upstream RUSTSEC-2024-0429 fix on every
# Tauri/GTK/GLib dependency update. When a patched GLib release is compatible
# with the complete Linux dependency tree, remove this override and vendor/glib
# in favor of that upstream crate, update the regression dependency to the same
# version, and regenerate Cargo.lock.
glib = { path = "vendor/glib" }
