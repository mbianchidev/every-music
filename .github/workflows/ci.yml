name: Every.music CI

on:
  push:
    branches: [master, main, "release/**", "hotfix/**", "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  integration:
    name: PostgreSQL integration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: everymusic
          POSTGRES_PASSWORD: integration-password
          POSTGRES_DB: everymusic
        options: >-
          --health-cmd "pg_isready -U everymusic -d everymusic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Bootstrap, migrate, and smoke test
        working-directory: backend
        env:
          REALM_ENV: test
          REALM_CONNECTION: postgresql://everymusic:integration-password@127.0.0.1:5432/everymusic
          CIPHER_PRIMARY_KEY: integration-primary-key-that-is-at-least-32-characters
          CIPHER_REFRESH_KEY: integration-refresh-key-that-is-at-least-32-characters
          PORTAL_ORIGINS: http://localhost:3000
        run: |
          npm run bootstrap
          npm run migrate
          npm start > /tmp/everymusic-nexus.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/everymusic-nexus.log' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/health/ready
          npm run smoke

  tauri:
    name: Tauri check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - run: cargo check --locked
        working-directory: frontend/src-tauri

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --no-cache -t everymusic-nexus:test backend
      - run: docker build --no-cache -t everymusic-web:test frontend
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: compose-test-password
          CIPHER_PRIMARY_KEY: compose-primary-key-that-is-at-least-32-characters
          CIPHER_REFRESH_KEY: compose-refresh-key-that-is-at-least-32-characters
          MAIL_GATEWAY: smtp.example.test
          MAIL_IDENTITY: noreply@example.test
          MAIL_CREDENTIAL: compose-mail-password
          MAIL_SENDER_ALIAS: Every.music <noreply@example.test>
        run: docker compose config --quiet

  desktop-release:
    name: Desktop bundle (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    needs: [frontend, tauri]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
        working-directory: frontend
      - name: Validate packaged API URL
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.DESKTOP_API_BASE_URL }}
        run: >-
          node -e "const value = process.env.VITE_API_BASE_URL;
          if (!value) throw new Error('DESKTOP_API_BASE_URL repository variable is required');
          const url = new URL(value);
          if (!['http:', 'https:'].includes(url.protocol) || !url.pathname.endsWith('/realm'))
          throw new Error('DESKTOP_API_BASE_URL must be an absolute HTTP(S) URL ending in /realm');"
      - run: npm run desktop:build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.DESKTOP_API_BASE_URL }}
